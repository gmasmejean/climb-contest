name: climbcontest

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ['node_modules/.bin/tsx', 'packages/db/src/migrate.ts']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ['node_modules/.bin/tsx', 'packages/db/src/seed.ts']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ['seed']

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${PUBLIC_APP_URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  web-build:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: web-build
    volumes:
      - web-dist:/output
    command: ['sh', '-c', 'cp -r apps/web/dist/. /output/']

  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web-dist:/srv:ro
      - caddy-data:/data
    depends_on:
      web-build:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  postgres-data:
  web-dist:
  caddy-data:
