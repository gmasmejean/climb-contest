name: CI

on:
  push:
    # `production` passe par deploy.yml, qui appelle ce workflow avant de
    # publier les images (Lot 22) : pas besoin de le tester deux fois.
    branches: ['**', '!production']
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  # `github.workflow` vaut « Deploy » quand deploy.yml appelle ce workflow :
  # le groupe diffère de celui d'un push ordinaire.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Testcontainers (packages/db, apps/api) a besoin de Docker — présent
      # nativement sur les runners GitHub-hébergés `ubuntu-latest`.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
